name: 搜索召回测试

# 为什么要有这条流水线：
#   搜索是本站最主要的入口（「已知工具名直接搜」），而它的退化是**静默的** ——
#   改一行打分、动一下词表、少写一个字段，构建照样成功、页面照样打开，
#   只是某些说法开始搜不到东西，没人会收到通知。
#   scripts/search-recall.mjs 用真实浏览器跑 34 条用例（中文口语 / 英文长句 /
#   定义类问答 / 一条陷阱），把「搜得到」这件事变成可回归的断言。
#
# 为什么不在 daily-news 里跑：
#   那条流水线负责抓资讯并提交，跑挂了就会挡住当天的内容更新。
#   召回测试是代码质量的守卫，跟着 push / PR 走更合适。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-recall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recall:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 零依赖：不需要 npm install
      - name: 构建站点
        run: node scripts/build.mjs

      # 召回测试要读真实页面（用的就是站点实际的分词、词表和排序），
      # 所以必须先起本地服务。这里后台起、然后轮询等它就绪，
      # 不用 sleep 猜时间（runner 冷启动慢，猜短了会假失败）。
      - name: 起本地服务
        run: |
          node scripts/serve.mjs 4173 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/search/; then
              echo "服务已就绪（第 $i 次探测）"
              exit 0
            fi
            sleep 0.5
          done
          echo "服务起不来，日志如下："
          cat /tmp/serve.log
          exit 1

      # ubuntu-latest 自带 Chrome。scripts/search-recall.mjs 里的候选路径已包含
      # /usr/bin/google-chrome 与 /usr/bin/chromium，找不到会直接报错退出。
      - name: 搜索召回测试
        run: node scripts/search-recall.mjs

      - name: 失败时输出服务日志
        if: failure()
        run: cat /tmp/serve.log || true
