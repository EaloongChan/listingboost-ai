name: 每周外链健康检查

# 为什么放在 GitHub 上而不是本地跑：
#   本机在境内，很多海外工具会返回「区域不可用」，
#   被误判成链接失效。GitHub 的 runner 是美国 IP，结果才可信。
#
# 结果有三个去处，缺一个这套东西就等于没做：
#   1. data/outbound-health.json —— 构建时读它，在工具页给用户提示「可能已失效」
#   2. 运行摘要 —— 顺手能看，不用翻日志
#   3. GitHub Issue —— 需要人处理的那几条（失效 / 换域名），会一直挂着直到清零
# 第 3 条是重点：写在日志里的结论等于没有结论，没人会去翻一周前的运行记录。

on:
  schedule:
    # 每周一 02:00 UTC（北京 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查全部外链
        run: node scripts/check-outbound.mjs

      # 判定逻辑全在脚本里（能在本地跑、能测），workflow 只管搬运
      - name: 生成巡检报告
        id: report
        run: |
          node scripts/link-health-report.mjs --out /tmp/link-health.md
          node scripts/link-health-report.mjs --summary
          echo "dead=$(node scripts/link-health-report.mjs --dead-count)" >> "$GITHUB_OUTPUT"
          echo "### 外链巡检" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node scripts/link-health-report.mjs --summary >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/link-health.md >> "$GITHUB_STEP_SUMMARY"

      # 结果写进 data/outbound-health.json，提交后构建与页面都能用到
      - name: 提交检查结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outbound-health.json
          if git diff --staged --quiet; then
            echo "结果无变化。"
          else
            git commit -m "chore: 外链健康检查 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 有失效就挂一个 issue，之后每周把新结果作为评论追加。
      # 用同一个 issue 而不是每周新开一个：这样它是一个「待办清单」，
      # 而不是一堆没人看的周报。清零时自动关掉。
      - name: 有失效则开/更新 issue
        if: steps.report.outputs.dead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create link-health --color B60205 \
            --description "外链巡检自动生成的待处理事项" --force || true

          NUM=$(gh issue list --label link-health --state open --json number --jq '.[0].number // empty')
          TITLE="外链巡检：$(node scripts/link-health-report.mjs --dead-count) 个链接疑似失效"

          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --label link-health --body-file /tmp/link-health.md
            echo "已新建 issue。"
          else
            gh issue edit "$NUM" --title "$TITLE"
            {
              echo "### 本周巡检 $(date -u +%Y-%m-%d)"
              echo ""
              cat /tmp/link-health.md
            } > /tmp/comment.md
            gh issue comment "$NUM" --body-file /tmp/comment.md
            echo "已更新 issue #$NUM。"
          fi

      - name: 失效清零则关闭 issue
        if: steps.report.outputs.dead == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --label link-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "本轮巡检失效数已清零，自动关闭。$(date -u +%Y-%m-%d)"
            gh issue close "$NUM"
            echo "已关闭 issue #$NUM。"
          else
            echo "没有待处理的 issue。"
          fi
